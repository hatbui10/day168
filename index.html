<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bảng 100 kỳ — Tô màu Lớn/Nhỏ</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --bg: #121212;
            --surface: #1e1e1e;
            --surface-2: #2a2a2a;
            --border: #3a3a3a;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --accent: #60a5fa;
            --cell: 30px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 0;
            display: flex;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }
        [hidden] { display: none !important; }
        button, textarea { font: inherit; }
        button { -webkit-tap-highlight-color: transparent; }
        .board-panel {
            width: max-content;
            max-width: 100%;
            margin: 0 auto;
            padding: 0;
            border: 0;
            background: transparent;
        }
        .board-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }
        .board-title { min-width: 0; }
        .board-title h1 {
            margin: 0;
            font-size: 15px;
            line-height: 1.25;
            color: #f8fafc;
        }
        .board-title small {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 10px;
        }
        .toolbar-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .icon-btn, .dialog-btn {
            min-height: 34px;
            padding: 6px 9px;
            border: 1px solid #475569;
            border-radius: 7px;
            background: #263244;
            color: #e2e8f0;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
        }
        .icon-btn:hover, .dialog-btn:hover { filter: brightness(1.13); }
        .icon-btn:active, .dialog-btn:active { transform: translateY(1px); }
        .icon-btn:disabled { opacity: .55; cursor: wait; }
        .icon-btn.primary, .dialog-btn.primary {
            border-color: #3b82f6;
            background: #1d4ed8;
            color: #fff;
        }
        .grid-table {
            --grid-gap: 3px;
            display: grid;
            grid-template-columns: repeat(10, var(--cell));
            gap: var(--grid-gap);
            width: max-content;
            max-width: 100%;
            padding: 8px;
            border-radius: 8px;
            background: #181818;
            box-shadow: inset 0 0 0 1px #262626;
        }
        .grid-cell {
            width: var(--cell);
            height: calc(var(--cell) + 4px);
            padding: 1px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--surface-2);
            transition: background .16s ease, border-color .16s ease, box-shadow .16s ease;
        }
        .grid-cell .stt-label {
            width: 100%;
            height: 10px;
            overflow: hidden;
            color: #ffeb3b;
            font-size: 7px;
            line-height: 10px;
            text-align: center;
            user-select: none;
        }
        .grid-cell .val-input {
            width: 100%;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
            pointer-events: none;
            user-select: none;
        }
        /* Màu duy nhất được giữ lại: nhóm B nằm giữa hai loại A. */
        .grid-cell.pat-hl {
            border-color: #f59e0b !important;
            background: linear-gradient(180deg,#fef3c7 0%,#fde68a 45%,#fbbf24 100%) !important;
            box-shadow: 0 0 6px rgba(251,191,36,.55);
        }
        .grid-cell.pat-hl .val-input { color: #451a03 !important; }
        .grid-cell.pat-hl .stt-label { color: #78350f !important; }
        .board-status {
            min-height: 16px;
            margin-top: 8px;
            color: #93c5fd;
            font-size: 10px;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }
        .board-status.error { color: #fda4af; }
        .board-status.ok { color: #86efac; }
        .board-note {
            margin-top: 5px;
            padding-top: 6px;
            border-top: 1px solid #334155;
            color: var(--muted);
            font-size: 9px;
            line-height: 1.45;
        }
        .board-note b { color: #fbbf24; font-weight: 700; }
        .dialog-backdrop {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(2,6,23,.78);
        }
        .dialog-backdrop.open { display: flex; }
        .dialog {
            width: min(100%, 480px);
            padding: 16px;
            border: 1px solid #475569;
            border-radius: 12px;
            background: #172033;
            box-shadow: 0 18px 60px rgba(0,0,0,.55);
        }
        .dialog h2 { margin: 0 0 8px; font-size: 16px; }
        .dialog p { margin: 0 0 10px; color: #a8b4c7; font-size: 11px; line-height: 1.5; }
        .dialog textarea {
            width: 100%;
            min-height: 150px;
            resize: vertical;
            padding: 10px;
            border: 1px solid #52627a;
            border-radius: 8px;
            outline: none;
            background: #0b1220;
            color: #e2e8f0;
            font-family: monospace;
            font-size: 11px;
        }
        .dialog textarea:focus { border-color: #60a5fa; }
        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 12px;
        }
        .dialog-btn.danger { border-color: #b91c1c; background: #7f1d1d; }
        @media (max-width: 380px) {
            :root { --cell: 25px; }
            body { padding-inline: 5px; }
            .board-panel { padding: 7px; }
            .grid-table { --grid-gap: 2px; padding: 6px; }
            .board-title h1 { font-size: 13px; }
            .board-title small { font-size: 9px; }
            .icon-btn { padding-inline: 7px; font-size: 10px; }
        }
        @media (max-width: 300px) {
            :root { --cell: 22px; }
            .grid-cell .val-input { font-size: 12px; }
            .toolbar-actions { gap: 4px; }
        }
    </style>
</head>
<body>
    <main class="board-panel" aria-label="Bảng kết quả 100 kỳ">
        <div id="gridContainer" class="grid-table" role="grid" aria-label="Bảng 10 dòng và 10 cột"></div>
        <div hidden aria-hidden="true">
            <span id="boardCount">0/100 kỳ</span>
            <span id="boardStatus" role="status" aria-live="polite"></span>
            <button type="button" id="btnRefresh">Làm mới</button>
            <button type="button" id="btnToken">Token</button>
        </div>
    </main>

    <div class="dialog-backdrop" id="tokenDialog" aria-hidden="true">
        <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="tokenDialogTitle">
            <h2 id="tokenDialogTitle">Token lấy kết quả</h2>
            <p>Dán access token hoặc toàn bộ JSON gồm token, refreshToken và tokenHeader. Thông tin chỉ dùng để đọc kết quả và đồng bộ bảng.</p>
            <textarea id="tokenInput" autocomplete="off" spellcheck="false" placeholder="eyJ... hoặc {&quot;token&quot;:&quot;...&quot;,&quot;refreshToken&quot;:&quot;...&quot;}"></textarea>
            <div class="dialog-actions">
                <button type="button" class="dialog-btn danger" id="btnClearToken">Xoá token</button>
                <button type="button" class="dialog-btn" id="btnCloseToken">Đóng</button>
                <button type="button" class="dialog-btn primary" id="btnSaveToken">Lưu &amp; nạp bảng</button>
            </div>
        </section>
    </div>

    <script>
    (function () {
        'use strict';

        const ROWS = 10;
        const COLS = 10;
        const TOTAL = ROWS * COLS;
        const LS_BOARD = 'vn168_board_v100';
        const LS_REFRESH_TOKEN = 'vn168_refresh_token';
        const LS_TOKEN_HEADER = 'vn168_token_header';
        const LS_TOKEN_AT = 'vn168_token_at';
        const FB_COLLECTION = 'vn168';
        const FB_DOC = 'data';

        const CFG = {
            arOrigin: 'https://373vn.com',
            apiResult: 'https://vn168api.com/api/webapi/GetNoaverageEmerdList',
            apiRefreshToken: 'https://vn168api.com/api/webapi/RefreshToken',
            payload: {
                typeId: 30,
                language: 2,
                random: '4d3fb5ed4f834fdb9bdfa7e947510b21',
                signature: 'F7752055ADB99E86DBC8B0DAC9AA224D',
                timestamp: 1772716919
            }
        };

        const gridContainer = document.getElementById('gridContainer');
        const statusEl = document.getElementById('boardStatus');
        const countEl = document.getElementById('boardCount');
        const refreshBtn = document.getElementById('btnRefresh');
        const tokenDialog = document.getElementById('tokenDialog');
        const tokenInput = document.getElementById('tokenInput');

        let cells = [];
        let boardCount = 0;
        let lastInsertedIssue = null;
        let fetchInProgress = false;
        let lastDriftResyncAt = 0;
        let currentToken = '';
        let memoryRefreshToken = '';
        let memoryTokenHeader = '';
        let localTokenStoredAt = 0;
        let deadToken = '';
        let applyingRemote = false;
        let remoteUnsub = null;
        let refreshTokenPromise = null;
        let apiFailStreak = 0;
        let apiCircuitUntil = 0;
        let fbDB = null;

        try { localTokenStoredAt = Number(localStorage.getItem(LS_TOKEN_AT) || 0) || 0; } catch (e) {}

        const firebaseConfig = {
            apiKey: 'AIzaSyBKQGr19UsETmy24RCBIXQuETE6c4WWZ7I',
            authDomain: 'vn-d925e.firebaseapp.com',
            projectId: 'vn-d925e',
            storageBucket: 'vn-d925e.firebasestorage.app',
            messagingSenderId: '128210473722',
            appId: '1:128210473722:web:fb30f15f7bf4828c3bef43',
            measurementId: 'G-EZMVTFJRNY'
        };
        try {
            if (window.firebase && firebase.firestore) {
                const app = (firebase.apps && firebase.apps.length) ? firebase.app() : firebase.initializeApp(firebaseConfig);
                fbDB = firebase.firestore(app);
            }
        } catch (e) {
            console.log('[Firebase] Chưa khả dụng:', e.message);
        }

        function setStatus(message, kind) {
            statusEl.textContent = String(message || '');
            statusEl.className = 'board-status' + (kind ? ' ' + kind : '');
        }

        function updateBoardCount() {
            countEl.textContent = boardCount + '/100 kỳ · mới nhất ở ô cuối';
        }

        function initGrid() {
            gridContainer.innerHTML = '';
            cells = [];
            const fragment = document.createDocumentFragment();
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const box = document.createElement('div');
                    box.className = 'grid-cell';
                    box.setAttribute('role', 'gridcell');
                    const sttEl = document.createElement('span');
                    sttEl.className = 'stt-label';
                    const valEl = document.createElement('span');
                    valEl.className = 'val-input';
                    box.appendChild(sttEl);
                    box.appendChild(valEl);
                    fragment.appendChild(box);
                    cells.push({ stt: null, sttFull: null, value: '', valEl: valEl, sttEl: sttEl });
                }
            }
            gridContainer.appendChild(fragment);
            renderAll();
        }

        function issueYmd(issue) {
            const s = String(issue == null ? '' : issue).replace(/\D/g, '');
            return /^\d{8}/.test(s) ? s.slice(0, 8) : '';
        }

        function ymdPretty(ymd) {
            return ymd.slice(0,4) + '-' + ymd.slice(4,6) + '-' + ymd.slice(6,8);
        }

        function renderCell(i) {
            const cell = cells[i];
            cell.valEl.textContent = cell.value;
            cell.sttEl.textContent = cell.stt === null ? '' : cell.stt;
            const box = cell.valEl.parentElement;
            const full = cell.sttFull || '';
            const ymd = full ? issueYmd(full) : '';
            box.title = full
                ? ('ID ' + full + (ymd ? ' · ngày ' + ymdPretty(ymd) : '') + ' · STT ' + String(full).slice(-3) + ' · số ' + cell.value)
                : ('STT ' + (cell.stt || '') + ' · số ' + cell.value);
            box.setAttribute('aria-label', box.title);
        }

        // ===== TÔ VÀNG NHÓM "B" THEO MẪU A-B…B-A (CHỈ TÔ B) =====
        // Lấy 6 Ô CUỐI CÙNG làm chuẩn:
        //   • B = loại của ô CUỐI CÙNG (LỚN nếu 5-9, NHỎ nếu 0-4). A = loại NGƯỢC LẠI của B.
        //   • Đếm nhóm B liền nhau ở ĐUÔI bảng (tối đa 6 ô) → gọi là k.
        //   • k = 1  → tô ô cuối B và tô ô ĐƠN LẺ A nằm giữa hai ô B: B-A-B.
        //   • k >= 2 → tô đúng k ô B ở đuôi.
        //   • Quét NGƯỢC về đầu bảng: mỗi đoạn A | B…B (đúng k ô) | A → chỉ tô k ô B ở GIỮA,
        //     gặp nhóm B DÀI HƠN k thì KHÔNG tô và DỪNG quét.
        //   • Mỗi lần áp dụng chỉ tô MỘT loại — không tô lẫn lớn với nhỏ.
        function applyPatHighlight() {
            try {
                const boxes = [];
                for (let i = 0; i < cells.length; i++) {
                    const b = cells[i].valEl && cells[i].valEl.parentElement;
                    boxes.push(b);
                    if (b) b.classList.remove('pat-hl');
                }
                const ot = (i) => {
                    const v = cells[i].value;
                    if (v === '' || v === null || v === undefined) return -1;
                    const d = parseInt(String(v), 10);
                    if (!Number.isInteger(d) || d < 0 || d > 9) return -1;
                    return d >= 5 ? 1 : 0;
                };
                const idx = [];
                for (let i = 0; i < cells.length; i++) if (ot(i) >= 0) idx.push(i);
                const n = idx.length;
                if (n < 2) return;
                const t = idx.map(ot);

                const WIN = 6;
                const B = t[n - 1];
                const A = B === 1 ? 0 : 1;

                let k = 0;
                for (let j = n - 1; j >= 0 && j >= n - WIN; j--) {
                    if (t[j] === B) k++; else break;
                }
                const mark = (from, to) => {
                    for (let j = from; j <= to; j++) {
                        const b = boxes[idx[j]];
                        if (b) b.classList.add('pat-hl');
                    }
                };

                // Ô cuối khác loại với ô kế cuối: tô cả ô cuối và các ô A đơn lẻ trong mẫu B-A-B.
                // Ví dụ LỚN-NHỎ-LỚN tô NHỎ ở giữa và LỚN ở cuối; NHỎ-LỚN-NHỎ cũng áp dụng tương tự.
                if (k === 1) {
                    for (let j = n - 2; j >= 1; j--) {
                        if (t[j] === A && t[j - 1] === B && t[j + 1] === B) mark(j, j);
                    }
                    mark(n - 1, n - 1);
                    return;
                }

                mark(n - k, n - 1);

                let p = n - k - 1;
                while (p >= 0) {
                    if (t[p] !== B) { p--; continue; }
                    let q = p;
                    while (q >= 0 && t[q] === B) q--;
                    const len = p - q;
                    if (len > k) break;
                    if (len === k && q >= 0 && t[q] === A) mark(q + 1, p);
                    p = q;
                }
            } catch (e) {}
        }

        function renderAll() {
            for (let i = 0; i < TOTAL; i++) renderCell(i);
            applyPatHighlight();
            updateBoardCount();
        }

        function recountBoard() {
            boardCount = 0;
            for (let i = 0; i < TOTAL; i++) {
                if (/^[0-9]$/.test(String(cells[i].value || ''))) boardCount++;
            }
        }

        function clearCellData() {
            for (let i = 0; i < TOTAL; i++) {
                cells[i].value = '';
                cells[i].stt = null;
                cells[i].sttFull = null;
            }
            boardCount = 0;
        }

        function saveBoardLocal() {
            const parts = [];
            for (let k = 0; k < cells.length; k++) {
                const c = cells[k];
                parts.push((c.value || '') + ',' + (c.stt === null || c.stt === undefined ? '' : c.stt) + ',' + (c.sttFull || ''));
            }
            const out = 'v3|' + (lastInsertedIssue || '') + '|' + parts.join(';');
            try { localStorage.setItem(LS_BOARD, out); } catch (e) {}
        }

        function loadBoardLocal() {
            let data = null;
            try {
                const raw = localStorage.getItem(LS_BOARD) || '';
                if (raw.indexOf('v3|') === 0) {
                    const p1 = raw.indexOf('|', 3);
                    const parts = raw.slice(p1 + 1).split(';');
                    const arr = [];
                    for (let k = 0; k < parts.length; k++) {
                        const f = parts[k].split(',');
                        arr.push({ v: f[0] || '', s: f[1] || '', f: f[2] || '' });
                    }
                    data = { lastIssue: raw.slice(3, p1) || null, cells: arr };
                } else if (raw) {
                    data = JSON.parse(raw);
                }
            } catch (e) {}
            if (!data || !Array.isArray(data.cells) || !data.cells.length) return false;
            clearCellData();
            let saved = data.cells;
            if (saved.length > TOTAL) saved = saved.slice(saved.length - TOTAL);
            const offset = TOTAL - saved.length;
            for (let i = 0; i < saved.length; i++) {
                const src = saved[i];
                if (!src) continue;
                cells[offset + i].value = /^[0-9]$/.test(String(src.v || '')) ? String(src.v) : '';
                cells[offset + i].stt = src.s === '' || src.s === null || src.s === undefined ? null : String(src.s);
                cells[offset + i].sttFull = src.f ? String(src.f) : null;
            }
            lastInsertedIssue = data.lastIssue ? String(data.lastIssue) : null;
            recountBoard();
            renderAll();
            return boardCount > 0;
        }

        function extractToken(str) {
            const s = String(str || '');
            const m = s.match(/eyJ[A-Za-z0-9\-_]+(?:\.[A-Za-z0-9\-_]+){1,3}/);
            if (m) return m[0];
            return s.replace(/[^\x00-\x7F]/g, '').trim();
        }

        function cleanAuthSecret(value) {
            let text = String(value == null ? '' : value).trim();
            if (text.length >= 2 && ((text[0] === '"' && text[text.length - 1] === '"') || (text[0] === "'" && text[text.length - 1] === "'"))) {
                try { text = JSON.parse(text); } catch (e) { text = text.slice(1, -1); }
                text = String(text || '').trim();
            }
            return text.replace(/^Bearer\s+/i, '');
        }

        function normalizeTokenHeader(value) {
            const text = String(value == null ? '' : value).trim();
            if (!text) return 'Bearer ';
            if (/^bearer$/i.test(text) || /^bearer\s+/i.test(text)) return 'Bearer ';
            if (/^[A-Za-z][A-Za-z0-9_-]*$/.test(text)) return text + ' ';
            return text;
        }

        function parseAuthBundle(text) {
            const raw = String(text == null ? '' : text).trim();
            const out = { token: '', refreshToken: '', tokenHeader: '' };
            if (!raw) return out;
            const takeObj = function (obj) {
                if (!obj || typeof obj !== 'object') return;
                const vals = {};
                Object.keys(obj).forEach(function (key) { vals[String(key).toLowerCase()] = obj[key]; });
                const tok = vals.token || vals.accesstoken || vals.access_token || '';
                const ref = vals.refreshtoken || vals.refresh_token || '';
                const hdr = vals.tokenheader || vals.token_header || '';
                if (tok && !out.token) out.token = extractToken(cleanAuthSecret(tok));
                if (ref && !out.refreshToken) out.refreshToken = cleanAuthSecret(ref);
                if (hdr && !out.tokenHeader) out.tokenHeader = String(hdr);
                if (obj.data && typeof obj.data === 'object') takeObj(obj.data);
            };
            try {
                const parsed = JSON.parse(raw);
                if (parsed && typeof parsed === 'object') takeObj(parsed);
                else if (typeof parsed === 'string') out.token = extractToken(parsed);
            } catch (e) {}
            const jwts = raw.match(/eyJ[A-Za-z0-9\-_]+(?:\.[A-Za-z0-9\-_]+){1,3}/g) || [];
            if (!out.refreshToken) {
                const labelled = raw.match(/refresh[_ ]?token["']?\s*(?:[:=]\s*)?["']?\s*(eyJ[A-Za-z0-9\-_]+(?:\.[A-Za-z0-9\-_]+){1,3})/i);
                if (labelled) out.refreshToken = cleanAuthSecret(labelled[1]);
            }
            if (!out.token) {
                const labelled = raw.match(/(?:^|[^A-Za-z])(?:access[_ ]?token|token)["']?\s*(?:[:=]\s*)?["']?\s*(eyJ[A-Za-z0-9\-_]+(?:\.[A-Za-z0-9\-_]+){1,3})/i);
                if (labelled) out.token = labelled[1];
            }
            if (!out.token && jwts.length) out.token = jwts[0];
            if (!out.refreshToken && jwts.length > 1) {
                for (let i = 0; i < jwts.length; i++) {
                    if (jwts[i] !== out.token) { out.refreshToken = jwts[i]; break; }
                }
            }
            if (!out.tokenHeader) {
                const hm = raw.match(/token[_ ]?header["']?\s*[:=]\s*["']?([^"'\r\n,}]+)/i);
                if (hm) out.tokenHeader = hm[1];
            }
            out.refreshToken = cleanAuthSecret(out.refreshToken);
            out.tokenHeader = normalizeTokenHeader(out.tokenHeader);
            return out;
        }

        function tokenPayload(token) {
            try {
                const part = String(token || '').split('.')[1];
                if (!part) return null;
                let b64 = part.replace(/-/g, '+').replace(/_/g, '/');
                while (b64.length % 4) b64 += '=';
                const bin = atob(b64);
                let pct = '';
                for (let i = 0; i < bin.length; i++) pct += '%' + ('00' + bin.charCodeAt(i).toString(16)).slice(-2);
                return JSON.parse(decodeURIComponent(pct));
            } catch (e) { return null; }
        }

        function tokenExpMs(token) {
            const payload = tokenPayload(token);
            const exp = payload ? Number(payload.exp) : NaN;
            return Number.isFinite(exp) && exp > 0 ? exp * 1000 : 0;
        }

        function isTokenExpiredLocally(token, skewMs) {
            const exp = tokenExpMs(token);

            if ('result' in row) return row.result;
            for (const key in row) {
                const value = row[key];
                if (typeof value === 'string' && /[0-9]/.test(value)) return value;
            }
            return null;
        }

        function issueGreater(a, b) {
            a = String(a || '').trim();
            b = String(b || '').trim();
            if (!b) return !!a;
            if (!a) return false;
            const aNum = /^\d+$/.test(a);
            const bNum = /^\d+$/.test(b);
            if (aNum && bNum) {
                if (a.length !== b.length) return a.length > b.length;
                return a > b;
            }
            return a > b;
        }

        function isNewerIssue(current, last) {
            current = String(current || '').trim();
            last = String(last || '').trim();
            return !!current && current !== last && issueGreater(current, last);
        }

        function sortRowsOldToNew(rows) {
            return rows.filter(function (row) { return String(rowIssue(row) || '').trim(); }).sort(function (a, b) {
                const ia = String(rowIssue(a) || '');
                const ib = String(rowIssue(b) || '');
                if (ia === ib) return 0;
                return issueGreater(ia, ib) ? 1 : -1;
            });
        }

        async function fetchResultPage(pageNo, pageSize, scheme) {
            const paging = scheme || { page: 'pageNo', size: 'pageSize' };
            const params = { typeId: CFG.payload.typeId };
            params[paging.page] = pageNo;
            params[paging.size] = pageSize;
            const fallbackBody = Object.assign({}, CFG.payload);
            fallbackBody[paging.page] = pageNo;
            fallbackBody[paging.size] = pageSize;
            const attempts = [buildSignedBody(params), fallbackBody];
            if (pageNo === 1 && paging.page === 'pageNo' && paging.size === 'pageSize') attempts.push(CFG.payload);
            let lastResponse = null;
            let lastError = null;
            for (const body of attempts) {
                try {
                    const res = await apiPostRetry(CFG.apiResult, body, 2, 700);
                    lastResponse = res;
                    if (findRows(res).length) return res;
                } catch (error) {
                    lastError = error;
                }
            }
            if (lastResponse) return lastResponse;
            throw lastError || new Error('Không lấy được trang kết quả.');
        }

        async function fetchLatestRows(count) {
            const wanted = Math.max(1, Math.min(TOTAL, Math.floor(Number(count) || TOTAL)));
            const pageSize = 100;
            const byIssue = new Map();
            const schemes = [
                { page: 'pageNo', size: 'pageSize' },
                { page: 'page', size: 'pageSize' },
                { page: 'page', size: 'limit' },
                { page: 'pageIndex', size: 'pageSize' }
            ];
            let lastError = null;

            // Một số phiên bản API dùng tên tham số phân trang khác nhau hoặc trả ít hơn pageSize.
            // Nếu một kiểu phân trang lặp lại dữ liệu, thử kiểu khác cho tới khi đủ 100 kỳ.
            for (const scheme of schemes) {
                let pageNo = 1;
                while (byIssue.size < wanted && pageNo <= 15) {
                    let res;
                    try {
                        res = await fetchResultPage(pageNo, pageSize, scheme);
                    } catch (error) {
                        lastError = error;
                        break;
                    }
                    const rows = findRows(res).filter(function (row) { return String(rowIssue(row) || '').trim(); });
                    if (!rows.length) break;
                    let fresh = 0;
                    for (const row of rows) {
                        const issue = String(rowIssue(row)).trim();
                        if (!byIssue.has(issue)) { byIssue.set(issue, row); fresh++; }
                    }
                    if (!fresh) break;
                    pageNo++;
                }
                if (byIssue.size >= wanted) break;
            }

            const all = sortRowsOldToNew(Array.from(byIssue.values()));
            if (!all.length && lastError) throw lastError;
            return all.slice(-wanted);
        }

        function fillBoardFromRows(rows) {
            const byIssue = new Map();

            // Giữ lại dữ liệu đang có: API trả ít hơn 100 kỳ không được làm trống lại bảng.
            for (const cell of cells) {
                const issue = String(cell.sttFull || '').trim();
                const digit = valueToDigit(cell.value);
                if (issue && digit !== null) byIssue.set(issue, { issue: issue, digit: digit });
            }
            for (const row of rows) {
                const issue = String(rowIssue(row) || '').trim();
                const digit = valueToDigit(rowBitValue(row));
                if (issue && digit !== null) byIssue.set(issue, { issue: issue, digit: digit });
            }
            if (!byIssue.size) return 0;

            const merged = Array.from(byIssue.values()).sort(function (a, b) {
                if (a.issue === b.issue) return 0;
                return issueGreater(a.issue, b.issue) ? 1 : -1;
            });
            const take = merged.slice(-TOTAL);
            clearCellData();
            const start = TOTAL - take.length;
            for (let k = 0; k < take.length; k++) {
                const item = take[k];
                cells[start + k].value = item.digit;
                cells[start + k].stt = item.issue.padStart(3, '0').slice(-3);
                cells[start + k].sttFull = item.issue;
            }
            lastInsertedIssue = take[take.length - 1].issue;
            recountBoard();
            renderAll();
            saveBoardLocal();
            return take.length;
        }

        function appendResult(row) {
            const digit = valueToDigit(rowBitValue(row));
            const issue = String(rowIssue(row) || '').trim();
            if (digit === null || !issue) return false;
            for (let i = 0; i < TOTAL - 1; i++) {
                cells[i].value = cells[i + 1].value;
                cells[i].stt = cells[i + 1].stt;
                cells[i].sttFull = cells[i + 1].sttFull;
            }
            cells[TOTAL - 1].value = digit;
            cells[TOTAL - 1].stt = issue.padStart(3, '0').slice(-3);
            cells[TOTAL - 1].sttFull = issue;
            lastInsertedIssue = issue;
            recountBoard();
            return true;
        }

        async function refillBoardLatest() {
            const rows = await fetchLatestRows(TOTAL);
            if (!rows.length) return 0;
            const filled = fillBoardFromRows(rows);
            if (filled) await writeToFirebase();
            return filled;
        }

        async function refreshResults(manual, forceFull) {
            if (fetchInProgress) return;
            if (!getToken()) {
                if (manual) setStatus('Chưa có token. Bấm “Token” để nhập token lấy kết quả.', 'error');
                return;
            }
            if (!tokenAlive() && !getRefreshToken()) {
                if (manual) setStatus('Token đã hết hạn. Vui lòng nhập token mới.', 'error');
                return;
            }
            fetchInProgress = true;
            refreshBtn.disabled = true;
            if (manual) setStatus('Đang nạp 100 kỳ gần nhất…');
            try {
                await ensureFreshToken(60000);
                if (!getToken()) throw new Error('Chưa có token.');

                if (forceFull || !lastInsertedIssue || boardCount === 0) {
                    const filled = await refillBoardLatest();
                    if (!filled) throw new Error('Không tìm thấy dữ liệu kết quả.');
                    setStatus('Đã nạp ' + filled + ' kỳ · ' + new Date().toLocaleTimeString('vi-VN', { hour12: false }), 'ok');
                    return;
                }

                const res = await fetchResultPage(1, 100);
                const sorted = sortRowsOldToNew(findRows(res));
                if (!sorted.length) throw new Error('Không tìm thấy dữ liệu kết quả.');
                const toAppend = sorted.filter(function (row) {
                    return issueGreater(String(rowIssue(row) || ''), String(lastInsertedIssue || ''));
                });

                if (toAppend.length) {
                    let added = 0;
                    for (const row of toAppend) if (appendResult(row)) added++;
                    renderAll();
                    saveBoardLocal();
                    if (added) await writeToFirebase();
                    setStatus('Đã thêm ' + added + ' kỳ mới · ' + new Date().toLocaleTimeString('vi-VN', { hour12: false }), 'ok');
                    return;
                }

                const apiNewest = String(rowIssue(sorted[sorted.length - 1]) || '');
                const boardNewest = String(cells[TOTAL - 1].sttFull || '');
                const drift = apiNewest && apiNewest !== boardNewest && (!boardNewest || !issueGreater(boardNewest, apiNewest));
                if (drift && (manual || Date.now() - lastDriftResyncAt > 60000)) {
                    lastDriftResyncAt = Date.now();
                    const filled = await refillBoardLatest();
                    setStatus('Đã đồng bộ lại ' + filled + ' kỳ.', 'ok');
                } else if (manual) {
                    setStatus('Bảng đã là dữ liệu mới nhất.', 'ok');
                }
            } catch (error) {
                setStatus('Lỗi lấy kết quả: ' + (error && error.message ? error.message : String(error)), 'error');
            } finally {
                fetchInProgress = false;
                refreshBtn.disabled = false;
            }
        }

        function openTokenDialog() {
            tokenInput.value = currentToken || '';
            tokenDialog.classList.add('open');
            tokenDialog.setAttribute('aria-hidden', 'false');
            setTimeout(function () { tokenInput.focus(); tokenInput.select(); }, 0);
        }

        function closeTokenDialog() {
            tokenDialog.classList.remove('open');
            tokenDialog.setAttribute('aria-hidden', 'true');
        }

        document.getElementById('btnToken').addEventListener('click', openTokenDialog);
        document.getElementById('btnCloseToken').addEventListener('click', closeTokenDialog);
        tokenDialog.addEventListener('click', function (event) {
            if (event.target === tokenDialog) closeTokenDialog();
        });
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && tokenDialog.classList.contains('open')) closeTokenDialog();
        });
        document.getElementById('btnSaveToken').addEventListener('click', async function () {
            const bundle = parseAuthBundle(tokenInput.value);
            if (!bundle.token) {
                setStatus('Không tìm thấy token hợp lệ trong nội dung đã dán.', 'error');
                return;
            }
            storeAuthBundle(bundle, { store: true });
            closeTokenDialog();
            await syncAuthBundleToFirebase();
            setStatus('Đã lưu token. Đang nạp bảng…', 'ok');
            refreshResults(true, true);
        });
        document.getElementById('btnClearToken').addEventListener('click', function () {
            clearToken();
            tokenInput.value = '';
            closeTokenDialog();
            setStatus('Đã xoá token trên máy này.', 'ok');
        });
        refreshBtn.addEventListener('click', function () { refreshResults(true, true); });

        initGrid();
        loadToken();
        const hasLocalBoard = loadBoardLocal();
        startRealtimeSync();
        if (hasLocalBoard) setStatus('Đã mở bảng đã lưu · đang kiểm tra kết quả mới…');
        else if (!getToken()) setStatus('Bấm “Token” để nhập token và nạp 100 kỳ vào bảng.');
        else setStatus('Đang chuẩn bị nạp 100 kỳ…');

        setTimeout(function () { refreshResults(false, false); }, 400);
        setInterval(function () {
            if (!fetchInProgress && getToken() && (tokenAlive() || getRefreshToken())) refreshResults(false, false);
        }, 5000);
        setInterval(function () {
            if (getToken() && getRefreshToken()) ensureFreshToken(120000).catch(function () {});
        }, 30000);
    })();
    </script>
